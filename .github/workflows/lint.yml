name: lint

# У этого репозитория своего CI не было, при том что в нём лежит линт-конвейер ВСЕГО дерева.
# Цена отсутствия известна по 19 октября 2026: правка `Makefile` здесь действует на CI обеих
# прошивок немедленно (они выкачивают этот репозиторий первым, по ветке по умолчанию и без
# пина), поэтому поломка краснела в ЧУЖИХ репозиториях, а в своём не проверялась никак —
# прогонов Actions у него было ноль.
#
# Что проверяется здесь: конвейер работает на СВОИХ файлах. Прошивок и ядра рядом нет
# намеренно — цели это переживают, потому что охват фильтруется (`PY_DIRS = $(wildcard
# $(PY_DIRS_ALL))`), и ровно эта способность и проверяется: в workspace прошивки лежит одна
# прошивка, а не четыре репозитория, и `ruff` на несуществующем пути даёт E902.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      # Без сабмодулей: приватный tdeck здесь не выкачать, да и не нужен — проверяем свои
      # файлы. Пустые каталоги-заглушки сабмодулей охват отфильтрует.
      - uses: actions/checkout@v4

      # Та же версия, что самая старая в CI прошивок, и та же, что в target-version ruff
      # (за их совпадением следит suite_meta.lint_target_version_test).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Установка ruff
        run: pip install ruff

      - name: Линт Python
        run: make lint-py

      - name: Формат Python
        run: make format-py-check

      # Своего C++ здесь нет (он в сабмодулях), поэтому clang-format и clang-tidy не
      # гоняются: без исходников они проверяли бы пустой список и давали ложное «зелёное».
      # C++ проверяется в CI каждой прошивки теми же целями make.
      - name: Охват конвейера описан и не врёт
        run: |
          grep -qF 'PY_DIRS_ALL =' Makefile
          grep -qF 'PY_DIRS = $(wildcard $(PY_DIRS_ALL))' Makefile
